<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日饮食与运动 · 滑动演示</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f6;color:#333;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px 12px}.demo{max-width:570px;margin:auto}.tools{display:flex;align-items:center;justify-content:space-between;margin:0 8px 18px;font-size:13px;color:#888}button{font:inherit;border:0;cursor:pointer;border-radius:20px;padding:9px 16px;background:white;color:#666}button:focus-visible{outline:2px solid #0cba9a}.card{background:white;border-radius:24px;padding:22px 16px}h1{margin:0;font-size:23px;display:flex;align-items:center;gap:10px}h1 span{color:#25cba3;font-size:27px}h1 b{margin-left:auto;color:#ccc;font-size:28px;font-weight:400}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:25px 7px 20px;font-size:14px;color:#999}.summary strong{font-size:17px;color:#333}.pink{color:#ff4d88}.frame{position:relative;border:1px solid #e8e8eb;border-radius:14px;overflow:hidden}.scroller{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab;touch-action:pan-x pan-y}.scroller::-webkit-scrollbar{display:none}.scroller.dragging{cursor:grabbing;user-select:none}table{border-collapse:separate;border-spacing:0;width:826px;table-layout:fixed;font-variant-numeric:tabular-nums}th{font-weight:400;color:#777;background:#fafafa;font-size:13px;height:32px}thead tr:first-child th{padding-top:10px}thead tr:last-child th{padding-bottom:10px}th[rowspan]{height:64px}td{height:84px;border-top:1px solid #ededf0;background:white;padding:9px 12px;text-align:right;font-size:17px}td small{display:block;color:#999;font-size:13px;margin-top:6px}.date{position:sticky;left:0;text-align:left;z-index:2;background:white;padding-left:12px}.date small{font-size:14px}th.date{z-index:3;background:#fafafa}.meal{text-align:center;padding:6px}.food{font-size:33px;height:39px;line-height:39px}.meal small{margin-top:3px;font-size:13px}.empty{width:39px;height:39px;border:1px dashed #e4e4e8;background:#fafafa;border-radius:11px;margin:auto}.empty+small{visibility:hidden}.group{background:#e1f7f1;color:#09bda7}.exercise{text-align:left;font-size:15px}.state{font-size:12px;display:inline-block;padding:2px 5px;border-radius:5px;margin-top:5px;background:#e0f8e9;color:#15b96c}.orange{background:#fff0e5;color:#fa8733}.progress{text-align:center}.frame:after{content:'';position:absolute;right:0;top:0;bottom:0;width:16px;pointer-events:none;background:linear-gradient(90deg,transparent,#ffffffdb);opacity:var(--fade,1)}.track{height:3px;background:#f0f0f3;margin:13px 7px 0;border-radius:8px}.thumb{height:3px;background:#cbd8d4;border-radius:8px;width:50%}.hint{text-align:center;font-size:12px;color:#999;margin:13px 0 0}.foot{margin:18px 9px;color:#999;font-size:12px;line-height:1.9}.wide{max-width:1000px}.wide table{width:100%}.wide .summary{justify-content:space-between}@media(max-width:380px){h1{font-size:20px}.summary{font-size:12px}.summary strong{font-size:15px}.card{padding:20px 10px}}
</style><main class="demo" id="demo"><div class="tools"><span>交互演示</span><div><button id="play">演示滑动</button> <button id="wide">展开宽屏</button></div></div><section class="card"><h1><span>♨</span>每日饮食与运动<b>›</b></h1><div class="summary"><strong>11.04–11.10</strong><span>减 <span class="pink">2.6kg</span> · 运动 <span class="pink">6</span> 天</span></div><div class="frame" id="frame"><div class="scroller" id="scroll" tabindex="0" aria-label="饮食与运动记录表，左右滑动查看更多列"><table><colgroup><col style="width:76px"><col style="width:82px"><col style="width:100px"><col style="width:92px"><col span="4" style="width:70px"><col style="width:196px"></colgroup><thead><tr><th rowspan="2" class="date">日期</th><th rowspan="2">体重<small>(kg)</small></th><th rowspan="2">目标进度</th><th rowspan="2">摄入<small>(千卡)</small></th><th colspan="4" class="group">饮食（千卡）</th><th rowspan="2" style="text-align:left;padding-left:12px">运动</th></tr><tr><th class="group">早餐</th><th class="group">午餐</th><th class="group">晚餐</th><th class="group">加餐</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="track"><div class="thumb" id="thumb"></div></div><p class="hint" id="hint">← 左右滑动，查看晚餐、加餐和运动 →</p></section><div class="foot">日期列固定 · 表头与内容同步滑动<br>手机可直接左右滑动；电脑可拖动表格或使用触控板。<br>本页为交互演示，数据沿用设计示例。</div></main><script>const data=[['11/10','今天','48.1','−0.2','12%','720','合适',['','🎃','🐟','🥛'],'瑜伽','2小时30分 · 另2项 ›'],['11/9','周一','48.3','−0.2','11%','—','',['','','',''],'—',''],['11/8','周日','48.5','−0.2','10%','60','偏低',['🥕','🐟','🍚','🍎'],'快走','20分钟'],['11/7','周六','48.7','−0.2','9%','60','偏低',['🍞','🥬','🍗','🥛'],'瑜伽','40分钟'],['11/6','周五','48.9','+0.4','8%','2450','超量',['🥦','🍄','🍜','🍌'],'慢跑','5 km'],['11/5','周四','—','','7%','178','偏低',['🍆','🥔','',''],'—',''],['11/4','周三','48.4','−0.2','—','730','合适',['🌽','🍌','🍤','🍓'],'力量训练','30分钟']];document.getElementById('rows').innerHTML=data.map(r=>`<tr><td class="date">${r[0]}<small style="${r[1]==='今天'?'color:#ff4d88':''}">${r[1]}</small></td><td>${r[2]}<small>${r[3]||'&nbsp;'}</small></td><td class="progress">${r[4]}</td><td>${r[5]}${r[6]?`<br><span class="state ${r[6]==='合适'?'':'orange'}">${r[6]}</span>`:''}</td>${r[7].map(f=>`<td class="meal"><div class="${f?'food':'empty'}">${f}</div><small>340</small></td>`).join('')}<td class="exercise">${r[8]}<small>${r[9]}</small></td></tr>`).join('');const sc=document.getElementById('scroll'),thumb=document.getElementById('thumb'),hint=document.getElementById('hint');function update(){let max=sc.scrollWidth-sc.clientWidth;thumb.style.width=(sc.clientWidth/sc.scrollWidth*100)+'%';thumb.style.transform=`translateX(${sc.scrollLeft/sc.scrollWidth*sc.clientWidth}px)`;document.getElementById('frame').style.setProperty('--fade',max-sc.scrollLeft<3?0:1);hint.textContent=max<2?'全部列已展示':sc.scrollLeft>max-5?'向右滑动，返回体重与进度 →':'← 左右滑动，查看晚餐、加餐和运动 →'}sc.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);let down=false,start=0,left=0;sc.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;down=true;start=e.clientX;left=sc.scrollLeft;sc.setPointerCapture(e.pointerId);sc.classList.add('dragging')});sc.addEventListener('pointermove',e=>{if(down)sc.scrollLeft=left-(e.clientX-start)});function end(){down=false;sc.classList.remove('dragging')}sc.addEventListener('pointerup',end);sc.addEventListener('pointercancel',end);let playing=false;document.getElementById('play').onclick=async()=>{if(playing)return;playing=true;let b=document.getElementById('play');b.textContent='演示中…';sc.scrollTo({left:sc.scrollWidth,behavior:'smooth'});await new Promise(r=>setTimeout(r,1400));sc.scrollTo({left:0,behavior:'smooth'});await new Promise(r=>setTimeout(r,800));b.textContent='演示滑动';playing=false};document.getElementById('wide').onclick=e=>{let v=document.getElementById('demo').classList.toggle('wide');e.target.textContent=v?'收回窄屏':'展开宽屏';requestAnimationFrame(update)};update();</script></html>
