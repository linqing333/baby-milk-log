.phone{width:100%;aspect-ratio:614/1335;position:relative;overflow:hidden;isolation:isolate;background:#f0f0f2;container-type:inline-size;border-radius:5cqw;box-shadow:0 10px 35px #3623381a}

.panel{padding:2.65cqw 0 3cqw;border-top:1px solid #ebebeb;transform-origin:center}
.outgoing{position:absolute;inset:0 0 auto;pointer-events:none}
.heading{display:flex;align-items:center;gap:2.2cqw;font-size:4.06cqw;line-height:5.7cqw;font-weight:650;white-space:nowrap}

.row+.row{margin-top:2.93cqw}

.choice:active{transform:scale(.96)}
.choice.selected{background:#ffd9e6;color:#ff4d88;border-color:#ff82ae}
.choice:focus-visible,.replay:focus-visible{outline:2px solid #d92d68;outline-offset:2px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 0;color:#646069;gap:6px;font-size:12px}
.replay{border:1px solid #eadce4;background:white;border-radius:18px;padding:6px 10px;color:#994765;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.viewport,.choice{transition:none}}

const labels = ['配方奶','母乳','瓶喂母乳'];
let step = 1;
let pending = false;
let finished = false;
let timer;
let motion;
let outgoing;
let outgoingMotion;
function render() {
  const rows = Array.from({length: step === 2 ? 2 : 1}, (_, index) =>
    '<div class="row" role="group" aria-label="第'+(index+1)+'组选项">'+
    labels.map(label => '<button class="choice" type="button" aria-pressed="false">'+label+'</button>').join('')+'</div>'
  ).join('');
  panel.innerHTML = '<div class="heading"><img class="spark" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAcCAIAAAD9b0jDAAADKklEQVR42q2UTW9UVRjH/899OefcOy/SZtJSUEoNg4oimICTNMAC1BgXRncsWLvxC7jxE/gtdOHOBQsh0kQTSzUt1NIRE8GZUqSFtuNM32baueflYWElMtjxTuhvcXNz78nv3PP8n/sQM2M3WhsY+xLtNt65hL4BpMbr9nJ5HpUyT42jXkOXvXuTlsexUqMtYGYGzc29kNYWcL+KpoGRmLiJjT2R/lHmWh1awkj+axuVBST6+aTNdfx6A7U1NgJGkhYY+wWbWyml1Jm+buPBHfz4Lcqz2AAnESUZ6BgugxNv4OMSXh2E76WW1h/izhTPfE9/zqEFbCvoGEn85MomJs5iuMAfvkJvDWEo21W60cCNq/j5Mq8ukfNZS9Ixkph1RDvSCDpmHcMKAjExQPTeEXx6GlmxS02X5vDbBK8uw3lsAzISRsJI0or/vreKjSQrAAKDmIgJYxVUG12P/7CCm9dQnsLKOrYltyNKon8OHiGJYCJmHx6R5yEvcXwAH72GE4MpgtpqYnoSk9OorHDD4Ylax7ABVIjjAygdxIWXsU/1kj6ARGNiBt9cx/0WJxHpmK2ACOiTU/igCBU8tdg4BF6KPhUhRk/y0SK8DBnJLiR4dO4wzo90GtsG04+Q2HTNL0IqHUNhEFaAPYQ+3j+C3DNBTy7az8fdrVrq3/TNlzBUgBcSE44VcCDX2fPGuav3nAvs9WU4TieVAV4fQj5C6OHMIeRl54LKqv1pydrQTDTcwlbq0Xf2EIr9GOnDqYOIw52HlrHe5uqqvVx1EAxh17j99aKd23Zrdvf0/80P92Ad3n5xp6C1FqoN/F5344vmbstCOigD5XxFR/cFpT5xOuMPBv8n7eDKXXw165balqWFtFCOpSFloSyk85U3EucuZgP0xP4snxnm22v8yLgGOQ4dCQfBJKhfhYczwbAMBvwevxQAwLfrdraRfFfT885CWj/yizl5/gU5GgcH/BQ13R19bbn5xQNjhIui/Gf71dlMuvS7EpwrUDHvIPzhSJyMUrdU9/EuvfBCvwtC9W7Oyz3lCfAcyFJOzUONximmVC+4hvP6vD2W/iePARvfg/9H6z+dAAAAAElFTkSuQmCC">这条记录的喂奶方式是？ ('+step+'/3)</div><div class="detail">喂奶·100ml</div>'+rows;
  viewport.style.height = step === 2 ? '49.02cqw' : '34.04cqw';
}
function slide(element, from, to) {
  return element.animate(
    [{transform: 'translateX('+from+'%)'}, {transform: 'translateX('+to+'%)'}],
    {duration: 300, easing: 'cubic-bezier(.22,.75,.25,1)'}
  );
}
panel.addEventListener('click', async event => {
  const choice = event.target.closest('.choice');
  if (!choice || pending || finished) return;
  const keyboard = event.detail === 0;
  pending = true;
  choice.classList.add('selected');
  choice.setAttribute('aria-pressed','true');
  if(step === 3){
    finished = true;
    status.textContent = '已完成 3 道题';
    return;
  }
  timer = setTimeout(async () => {
    try {
      const shouldSlide = !reducedMotion.matches;
      if (shouldSlide) {
        outgoing = panel.cloneNode(true);
        outgoing.classList.add('outgoing');
        outgoing.inert = true;
        viewport.append(outgoing);
      }
      step++;
      render();
      status.textContent = '第 '+step+' 题，共 3 题';
      if (shouldSlide) {
        outgoingMotion = slide(outgoing, 0, -100);
        motion = slide(panel, 100, 0);
        await Promise.all([outgoingMotion.finished, motion.finished]);
        outgoing.remove();
        outgoing = null;
      }
      pending = false;
      if(keyboard) panel.querySelector('button').focus();
    } catch(error) { if(error.name !== 'AbortError') throw error; }
  },reducedMotion.matches ? 0 : 170);
});
replay.addEventListener('click', () => {
  clearTimeout(timer);
  motion?.cancel();
  outgoingMotion?.cancel();
  outgoing?.remove();
  outgoing = null;
  step = 1;
  pending = false;
  finished = false;
  status.textContent = '点击任意选项，进入下一题';
  render();
});
render();
</script>
</body>
</html>
