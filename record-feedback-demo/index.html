&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

    &lt;span class=&quot;drip-sr&quot; aria-live=&quot;polite&quot; id=&quot;drip-announcement&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;

&lt;style&gt;
#drip-motion{padding:24px 8px;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;color:#323232;color-scheme:light}
#drip-motion *{box-sizing:border-box}
#drip-motion .drip-phone{width:390px;max-width:100%;height:844px;position:relative;overflow:hidden;border-radius:32px;background:#f2f2f6;box-shadow:0 12px 42px #00000016;border:1px solid #e5e5e9;font-size:15px;line-height:1.55}
#drip-motion .drip-header{height:86px;background:#f2f2f6;border-bottom:1px solid #e9e9ed}
#drip-motion .drip-start{position:absolute;top:48px;right:16px;border:1px solid #dedee2;background:#fff;border-radius:14px;padding:3px 12px;color:#777;font:inherit;font-size:12px;min-height:28px}
#drip-motion .drip-start:disabled{opacity:.55}
#drip-motion .drip-empty{margin:170px 0;text-align:center;color:#a5a5aa;font-size:16px}
#drip-motion .drip-audio{display:inline-flex;align-items:center;gap:5px;background:#f4f4f5;border-radius:12px;font-size:12px;padding:0 8px;margin-right:5px;vertical-align:2px;white-space:nowrap}
#drip-motion .drip-audio svg{width:10px;height:10px;color:#ff66a0;fill:#ff66a0}
#drip-motion .drip-feedback-slot{position:relative;min-height:72px;margin-top:12px;overflow:hidden}
#drip-motion .drip-saving{position:absolute;z-index:3;top:29px;left:0;right:0;height:43px;padding:0 9px;display:flex;align-items:center;gap:9px;color:#a5a5aa;font-size:14px;background:#f9f9fa;border-radius:10px}
#drip-motion .drip-thinking{display:flex;align-items:center;color:#ff66a0}
#drip-motion .drip-thinking img{width:19px;height:19px;object-fit:contain}
#drip-motion .drip-voice{width:100%;justify-content:center;color:#37373a;background:#fff;font-family:inherit;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto}
#drip-motion .drip-voice svg{position:absolute;left:12px;border:0;padding:0}
#drip-motion .drip-voice.is-pressing{background:#f7f7f8}
#drip-motion .drip-result{padding-bottom:0}
#drip-motion .drip-result&gt;.drip-tag{display:block;width:fit-content;height:17px}
#drip-motion .drip-result .drip-insight{margin-top:12px}
#drip-motion .drip-status{height:39px;padding:10px 23px 0;display:flex;justify-content:space-between;align-items:center;color:#080808;font-size:15px;font-weight:500}
#drip-motion .drip-status&gt;div{display:flex;align-items:center;gap:5px}
#drip-motion .drip-status svg{width:17px;height:17px;stroke-width:2.5}
#drip-motion .drip-status svg:last-child{width:23px;height:21px}
#drip-motion h1{margin:10px 0 0;text-align:center;font-size:18px;font-weight:500;line-height:28px}
#drip-motion .drip-feed{height:calc(100% - 86px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;overflow-anchor:none;padding:10px 11px 220px 23px}
#drip-motion .drip-feed::-webkit-scrollbar{display:none}
#drip-motion .drip-timeline{position:relative}
#drip-motion .drip-timeline:before{content:&quot;&quot;;position:absolute;left:-12px;top:-11px;bottom:-240px;width:1px;background:#dedee3}
#drip-motion .drip-date{display:flex;align-items:baseline;gap:5px;margin:0 0 8px;position:relative;line-height:32px;white-space:nowrap}
#drip-motion .drip-date:not(:first-child){margin-top:17px}
#drip-motion .drip-date:before{content:&quot;&quot;;position:absolute;left:-16px;top:12px;width:8px;height:8px;border-radius:50%;background:linear-gradient(#ff9bc6,#ff4899)}
#drip-motion .drip-date strong{font-size:23px;font-weight:500}
#drip-motion .drip-date&gt;span{font-size:13px;font-weight:400;color:#999}
#drip-motion .drip-record{position:relative;border-radius:13px;background:#fff;margin:0 0 8px;padding:10px 12px 12px}
#drip-motion .drip-record:before{content:&quot;&quot;;position:absolute;left:-15px;top:19px;width:6px;height:6px;border-radius:50%;background:#c9c9cd}
#drip-motion time{font-size:15px;color:#999}
#drip-motion .drip-record&gt;p{margin:11px 0 8px;line-height:1.65;font-size:16px}
#drip-motion .drip-weight{padding-bottom:11px}
#drip-motion .drip-weight&gt;p{margin:19px 0 0;display:flex;align-items:center;gap:9px;font-size:18px}
#drip-motion .drip-weight-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#e397ff,#b05aff);color:white}
#drip-motion .drip-weight-icon svg{width:15px;height:15px;stroke-width:3}
#drip-motion .drip-tag{font-size:12px;color:#c967ff;border:1px solid #cf7aff;line-height:15px;border-radius:3px;padding:0 3px;display:inline-block;vertical-align:top}
#drip-motion .drip-insight{margin-top:11px;border-radius:10px;background:#f9f9fa;overflow:hidden;position:relative;will-change:height}
#drip-motion .drip-compact{position:absolute;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:flex-end;padding:3px 8px 3px 15px;height:43px;background:linear-gradient(90deg,#f9f9fa00,#f9f9fa 18%);width:52px}
#drip-motion .drip-compact&gt;.drip-spark,#drip-motion .drip-compact&gt;.drip-truncate{display:none}
#drip-motion .drip-insight:after{content:&quot;&quot;;position:absolute;bottom:0;left:0;right:0;height:9px;background:#f9f9fa;pointer-events:none}
#drip-motion .drip-spark{color:#ff50a8;display:inline-flex;flex-shrink:0;vertical-align:-4px}
#drip-motion .drip-spark svg{width:19px;height:19px;fill:#ff7691;stroke-width:1.5}
#drip-motion .drip-spark img{width:19px;height:19px;object-fit:contain}
#drip-motion .drip-truncate{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;color:#707070}
#drip-motion .drip-toggle{font:inherit;font-size:13px;color:#507eaf;background:transparent;border:0;padding:9px 0;min-height:40px;flex-shrink:0;text-align:left;touch-action:manipulation}
#drip-motion .drip-toggle:focus-visible{outline:2px solid #507eaf;outline-offset:2px;border-radius:3px}
#drip-motion .drip-expanded{padding:8px 9px 9px;display:block!important}
#drip-motion .drip-expanded&gt;p{margin:0;color:#707070;font-size:14px;line-height:1.85;letter-spacing:.1px}
#drip-motion .drip-expanded .drip-spark{margin-right:9px}
#drip-motion .drip-chart-slot{margin:13px 0 1px;height:105px}
#drip-motion .drip-chart{display:block;width:100%;height:100%;overflow:visible}
#drip-motion .drip-chart text{font-family:inherit;font-size:10px;fill:#999}
#drip-motion .drip-chart .drip-value{fill:#ff659e;font-size:11px}
#drip-motion .drip-expanded&gt;.drip-toggle{margin-top:0}
#drip-motion [hidden]{display:none!important}
#drip-motion .drip-bottom{position:absolute;bottom:0;left:0;right:0;pointer-events:none}
#drip-motion .drip-composer{background:#fff;margin:0 10px 8px;border-radius:20px;padding:16px 12px 11px;box-shadow:0 -5px 22px #33333306}
#drip-motion .drip-shortcuts{display:flex;justify-content:space-between;margin-bottom:12px}
#drip-motion .drip-shortcuts&gt;div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
#drip-motion .drip-bubble{width:25px;height:25px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white}
#drip-motion .drip-bubble svg{width:21px;height:21px;stroke-width:2.3}
#drip-motion .pink{background:linear-gradient(#ff99cf,#ff4b98);border-radius:50% 50% 44% 44%}
#drip-motion .cyan{background:linear-gradient(#7ee8ff,#32c6f4)}
#drip-motion .purple{background:linear-gradient(#df99ff,#b45bfa)}
#drip-motion .yellow{background:#ffc400;border-radius:50%}
#drip-motion .orange{background:#ff9154}
#drip-motion .drip-input{height:44px;border:1px solid #e1e1e5;border-radius:24px;display:flex;align-items:center;gap:9px;padding:0 11px;color:#cbcbce;font-size:17px}
#drip-motion .drip-input svg{color:#777;width:24px;height:24px;border:1.5px solid #777;border-radius:50%;padding:3px}
#drip-motion .drip-nav{display:flex;background:#fff;justify-content:space-around;border-top:1px solid #ededf1;padding:7px 0 0;color:#666}
#drip-motion .drip-nav&gt;div{display:flex;align-items:center;flex-direction:column;gap:2px;font-size:11px;width:20%}
#drip-motion .drip-nav svg{width:22px;height:22px;stroke-width:1.7}
#drip-motion .drip-nav .drip-active{color:#ff4690}
#drip-motion .drip-home{height:27px;background:#fff;display:flex;justify-content:center;align-items:flex-end;padding-bottom:7px}
#drip-motion .drip-home&gt;span{display:block;width:130px;height:4px;border-radius:5px;background:#080808}
#drip-motion .drip-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:400px){#drip-motion{padding:12px 0}#drip-motion .drip-phone{border-radius:24px;height:810px}#drip-motion .drip-record&gt;p{font-size:15px}#drip-motion .drip-weight&gt;p{font-size:17px}}
&lt;/style&gt;

      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
