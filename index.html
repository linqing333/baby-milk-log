<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>宝宝奶量记录</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="top-panel" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Baby Feed Log</p>
          <h1 id="app-title">宝宝奶量</h1>
        </div>
        <div class="today-total" aria-live="polite">
          <span>今日总量</span>
          <strong id="todayTotal">0 ml</strong>
        </div>
      </section>

      <form id="feedForm" class="entry-panel">
        <p id="statusMessage" class="status-message" role="status" hidden></p>

        <label for="amount">奶量</label>
        <div class="amount-row">
          <input id="amount" name="amount" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="120" required />
          <span>ml</span>
        </div>

        <div class="quick-buttons" aria-label="快速选择奶量">
          <button type="button" data-amount="60">60</button>
          <button type="button" data-amount="90">90</button>
          <button type="button" data-amount="120">120</button>
          <button type="button" data-amount="150">150</button>
          <button type="button" data-amount="180">180</button>
        </div>

        <label for="feedTime">时间</label>
        <input id="feedTime" name="feedTime" type="datetime-local" required />

        <button class="primary-action" type="submit">记录这次奶量</button>
      </form>

      <section id="calendarView" class="summary-panel app-view active" aria-labelledby="summary-title">
        <div class="section-heading">
          <h2 id="summary-title">每日统计</h2>
          <button id="clearToday" class="subtle-action" type="button">清空今天</button>
        </div>
        <div class="calendar-toolbar">
          <button id="prevMonth" class="icon-action" type="button" aria-label="上个月">‹</button>
          <strong id="calendarTitle"></strong>
          <button id="nextMonth" class="icon-action" type="button" aria-label="下个月">›</button>
        </div>
        <div class="week-row" aria-hidden="true">
          <span>一</span>
          <span>二</span>
          <span>三</span>
          <span>四</span>
          <span>五</span>
          <span>六</span>
          <span>日</span>
        </div>
        <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
      </section>

      <section id="detailView" class="history-panel app-view" aria-labelledby="history-title" hidden>
        <div class="detail-topbar">
          <button id="backToCalendar" class="icon-action" type="button" aria-label="返回每日统计">‹</button>
          <div>
            <h2 id="history-title">记录明细</h2>
            <span id="detailDateLabel"></span>
          </div>
          <button id="clearSelectedDay" class="subtle-action danger" type="button">清空当天</button>
        </div>
        <div class="detail-total">
          <span>当天总量</span>
          <strong id="selectedDayTotal">0 ml</strong>
        </div>
        <ol id="feedList" class="feed-list"></ol>
      </section>
    </main>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <strong>还没有记录</strong>
        <span>添加第一次奶量后，这里会自动显示每天总量。</span>
      </div>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
